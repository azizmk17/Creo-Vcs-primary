<text x="70" y="1115" fill="#101828" font-size="30" text-anchor="start" dominant-baseline="hanging">How to read the change</text>
<text x="70" y="1164" fill="#344054" font-size="18" text-anchor="start" dominant-baseline="hanging">+% means 4.5.0 took less time than 4.4.0. Negative means it took longer.</text>
<text x="70" y="1210" fill="#344054" font-size="18" text-anchor="start" dominant-baseline="hanging">4.5.0 was faster in startup, service/BOM setup, row rendering and file sync; its working-directory integrity check was slower.</text>
<text x="70" y="1270" fill="#475467" font-size="16" text-anchor="start" dominant-baseline="hanging">Source medians: 4.4.0 n=3 component runs; 4.5.0 n=9. Startup medians use 3 runs per version.</text>
<text x="70" y="1300" fill="#475467" font-size="16" text-anchor="start" dominant-baseline="hanging">Existing reports only. Saved batches used different benchmark revisions/cache states; treat comparisons as indicative, not controlled release qualification.</text>
